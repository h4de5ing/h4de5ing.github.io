<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6e9cd2;
            --background-color: #f8f9fa;
            --sidebar-color: #2c3e50;
            --text-color: #333;
            --light-text: #fff;
            --border-color: #e1e4e8;
            --hover-color: #f0f7ff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--background-color);
            color: var(--text-color);
        }
        
        header {
            background-color: var(--primary-color);
            color: var(--light-text);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .logo i {
            font-size: 1.8rem;
        }
        
        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-color);
            color: var(--light-text);
            padding: 1.5rem 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 0 1.5rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1rem;
        }
        
        .file-list {
            overflow-y: auto;
            flex: 1;
        }
        
        .file-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background-color 0.2s;
        }
        
        .file-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .file-item i {
            margin-right: 0.75rem;
            font-size: 0.9rem;
        }
        
        .file-item.active {
            background-color: var(--primary-color);
            font-weight: 500;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .content-header {
            padding: 1rem 1.5rem;
            background-color: #fff;
            border-bottom: 1px solid var(--border-color);
        }
        
        .breadcrumb {
            font-size: 0.9rem;
            color: #666;
        }
        
        .content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            background-color: #fff;
        }
        
        /* Markdown内容样式 */
        .markdown-body {
            font-size: 16px;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: var(--primary-color);
        }
        
        .markdown-body p {
            margin-bottom: 1em;
        }
        
        .markdown-body pre {
            background-color: #f6f8fa;
            padding: 1em;
            border-radius: 6px;
            overflow: auto;
            margin-bottom: 1em;
        }
        
        .markdown-body code {
            background-color: rgba(175, 184, 193, 0.2);
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: 0.9em;
        }
        
        .markdown-body blockquote {
            border-left: 4px solid var(--secondary-color);
            padding-left: 1em;
            margin-left: 0;
            color: #666;
        }
        
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1em;
        }
        
        .markdown-body table, 
        .markdown-body th, 
        .markdown-body td {
            border: 1px solid var(--border-color);
        }
        
        .markdown-body th, 
        .markdown-body td {
            padding: 0.5em 1em;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .empty-state p {
            font-size: 1.2rem;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
        }
        
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #e74c3c;
            text-align: center;
        }
        
        .error-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .error-state p {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        
        .error-state button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-book"></i>
            <h1>Markdown知识库</h1>
        </div>
    </header>
    
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>文档列表</h2>
            </div>
            <div class="file-list" id="file-list">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载文档列表中...</p>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="content-header">
                <div class="breadcrumb" id="breadcrumb">
                    <span>首页</span> <i class="fas fa-chevron-right"></i> <span id="current-doc">选择文档</span>
                </div>
            </div>
            
            <div class="content" id="content">
                <div class="empty-state" id="empty-state">
                    <i class="fas fa-file-alt"></i>
                    <p>请从左侧选择一个文档</p>
                </div>
                <div class="markdown-body" id="markdown-content" style="display: none;"></div>
            </div>
        </main>
    </div>

    <script>
        // DOM元素
        const fileListElement = document.getElementById('file-list');
        const markdownContentElement = document.getElementById('markdown-content');
        const emptyStateElement = document.getElementById('empty-state');
        const currentDocElement = document.getElementById('current-doc');

        // 存储文件列表数据
        let fileListData = [];

        // 解析文件列表
        function parseFileList(list) {
            return list.split('\n')
                .filter(line => line.trim() !== '')
                .map(line => {
                    const [title, path] = line.split('#');
                    return { title: title.trim(), path: path.trim() };
                });
        }

        // 渲染文件列表
        function renderFileList(files) {
            fileListElement.innerHTML = '';
            
            if (files.length === 0) {
                fileListElement.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>没有找到文档</p>
                    </div>
                `;
                return;
            }
            
            files.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `<i class="far fa-file-alt"></i> ${file.title}`;
                
                fileItem.addEventListener('click', () => {
                    // 移除所有active类
                    document.querySelectorAll('.file-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    
                    // 添加active类到当前项
                    fileItem.classList.add('active');
                    
                    // 加载Markdown内容
                    loadMarkdownContent(file.path, file.title);
                });
                
                fileListElement.appendChild(fileItem);
            });
        }

        // 加载Markdown内容
        function loadMarkdownContent(path, title) {
            currentDocElement.textContent = title;
            emptyStateElement.style.display = 'none';
            markdownContentElement.style.display = 'block';
            
            // 显示加载状态
            markdownContentElement.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载文档中...</p>
                </div>
            `;
            
            // 从服务器获取Markdown内容
            fetch(path)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('文档加载失败: ' + response.statusText);
                    }
                    return response.text();
                })
                .then(content => {
                    // 使用Marked.js将Markdown转换为HTML
                    const html = marked.parse(content);
                    // 使用DOMPurify清理HTML
                    markdownContentElement.innerHTML = DOMPurify.sanitize(html);
                })
                .catch(error => {
                    markdownContentElement.innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>${error.message}</p>
                            <button onclick="loadMarkdownContent('${path}', '${title}')">重试</button>
                        </div>
                    `;
                });
        }

        // 从服务器获取文件列表
        function loadFileList() {
            fetch('./list.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('列表加载失败: ' + response.statusText);
                    }
                    return response.text();
                })
                .then(data => {
                    fileListData = parseFileList(data);
                    renderFileList(fileListData);
                })
                .catch(error => {
                    fileListElement.innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>${error.message}</p>
                            <button onclick="loadFileList()">重试</button>
                        </div>
                    `;
                });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadFileList();
        });
    </script>
</body>
</html>
